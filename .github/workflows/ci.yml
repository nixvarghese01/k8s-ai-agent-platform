# CI (README §7): unit tests and linters on every push and pull request. Nothing here needs the
# laptop or a cluster; live checks stay in `make status`.
name: ci

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            agent/requirements.txt
            mcp-servers/*/requirements.txt
            pipelines/requirements.txt
            serving/requirements.txt
      - name: OCR tools (Tesseract, poppler) for the document tests
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr poppler-utils
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider tests

  lint:
    name: lint (manifests, shell, PowerShell, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Kubernetes manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # CRDs (Traefik, ArgoCD, k3s HelmChartConfig) from the community catalog; anything
          # it doesn't know is skipped rather than failed
          # kustomization.yaml and trim.yaml are kustomize inputs (a delete patch), not resources
          ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.36.0 \
            -ignore-filename-pattern '(kustomization|trim)\.yaml' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            infra/k3s infra/argocd

      - name: Shell scripts (ShellCheck)
        run: shellcheck -S warning infra/scripts/*.sh infra/scripts/host/*.sh infra/argocd/*.sh

      - name: PowerShell scripts (PSScriptAnalyzer)
        shell: pwsh
        run: ./.github/lint-powershell.ps1

      - name: n8n workflows parse
        run: |
          python3 - <<'PY'
          import json, yaml
          doc = yaml.safe_load(open("infra/k3s/automation/n8n-workflows.yaml"))
          for name, body in doc["data"].items():
              wf = json.loads(body)
              nodes = {n["name"] for n in wf["nodes"]}
              for src, outs in wf["connections"].items():
                  assert src in nodes, f"{name}: connection from unknown node {src}"
                  for branch in outs["main"]:
                      for c in branch:
                          assert c["node"] in nodes, f"{name}: connection to unknown node {c['node']}"
              print(f"{name}: {len(nodes)} nodes, connections ok")
          PY
