# Weekly dependency updates as pull requests into development (CONTRIBUTING.md "Branching model";
# dependabot/* branches pass the branch policy). Grouped per ecosystem to keep the PR count low;
# pip and Docker skip major versions (Actions majors are kept: they rarely break a workflow).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /agent
      - /images/ml-base
      - /mcp-servers/*
      - /pipelines
      - /serving
      - /tests
      - /ui
      - /voice
    target-branch: development
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # major versions break APIs (mcp 2 isn't supported by langchain-mcp-adapters 0.3): upgrade
      # those by hand in a feature/ branch. Security updates still arrive for any version.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # faster-whisper 1.2.1 passes metadata_errors to av.open(); PyAV 19 removed it
      - dependency-name: av
        versions: [">=19"]

  - package-ecosystem: docker
    directories:
      - /agent
      - /images/ml-base
      - /mcp-servers/*
      - /mlops/mlflow
      - /pipelines
      - /serving
      - /ui
      - /voice
    target-branch: development
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
