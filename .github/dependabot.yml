# Weekly dependency updates as pull requests into development (CONTRIBUTING.md "Branching model";
# dependabot/* branches pass the branch policy). Grouped per ecosystem to keep the PR count low.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /agent
      - /images/ml-base
      - /mcp-servers/*
      - /pipelines
      - /serving
      - /tests
      - /ui
      - /voice
    target-branch: development
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /agent
      - /images/ml-base
      - /mcp-servers/*
      - /mlops/mlflow
      - /pipelines
      - /serving
      - /ui
      - /voice
    target-branch: development
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
