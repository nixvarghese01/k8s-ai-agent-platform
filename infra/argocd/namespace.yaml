apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
# Same defaults as the platform namespaces (infra/k3s/limits.yaml)
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: argocd
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
