# Default CPU/memory requests and limits for every platform namespace (README §8, §12).
# A container that sets no resources gets the defaults; none may exceed 2 CPUs, so a
# single workload can't pin all 8 WSL threads and heat the laptop.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: storage
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
---
