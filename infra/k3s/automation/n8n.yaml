# n8n at https://n8n.ai.local (README §6.17), profile automation. Workflows come from
# automation/n8n-workflows.yaml (imported and activated on every start). n8n keeps its own
# owner login as a second layer behind the platform sign-on; create it on first visit.
# SQLite on a volume (not Postgres) so the automation profile doesn't need the mlops one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: automation
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: automation
  labels:
    app: n8n
    local-ai/profile: automation # off unless the automation profile is on (scripts/profiles.sh)
spec:
  # no replicas: profiles.sh scales it (0/1); apply and ArgoCD leave that alone
  strategy:
    type: Recreate # SQLite on a ReadWriteOnce volume
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      # Kubernetes would inject N8N_PORT=tcp://... for the Service named n8n, which n8n reads as
      # its port setting and refuses (same trap as Authelia)
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's node user; also owns E:\ai-files in WSL
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Workflows from Git; replaces UI edits on each start. n8n 2.x imports them inactive (it
        # only activates on import in queue mode), so each one marked "active": true is then
        # published, which is what activates it.
        - name: import-workflows
          image: n8nio/n8n:2.42.4@sha256:9c0862a08090c79122069e23131d27529c250b92e90c9d51a6ec406fe1527c4e
          command:
            - sh
            - -c
            - |
              set -e
              n8n import:workflow --separate --input=/workflows
              for f in /workflows/*.json; do
                grep -q '"active": true' "$f" || continue
                id=$(sed -n 's/^ *"id": "\([^"]*\)".*/\1/p' "$f" | head -1)
                n8n publish:workflow --id="$id"
              done
          env:
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: encryption-key
            - name: GENERIC_TIMEZONE
              value: Asia/Dubai
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: N8N_PERSONALIZATION_ENABLED
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: workflows
              mountPath: /workflows
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: n8n
          # Pinned like LiteLLM: change tag + digest deliberately (both here and above)
          image: n8nio/n8n:2.42.4@sha256:9c0862a08090c79122069e23131d27529c250b92e90c9d51a6ec406fe1527c4e
          env:
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: encryption-key
            - name: GENERIC_TIMEZONE
              value: Asia/Dubai
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: N8N_PERSONALIZATION_ENABLED
              value: "false"
            - name: N8N_HOST
              value: n8n.ai.local
            - name: N8N_PROTOCOL
              value: https
            - name: WEBHOOK_URL
              value: https://n8n.ai.local/
            - name: N8N_PROXY_HOPS
              value: "1" # behind Traefik
            # Only the briefings folder is writable for the "Read/Write Files" node
            - name: N8N_RESTRICT_FILE_ACCESS_TO
              value: /briefings
          ports:
            - name: http
              containerPort: 5678
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: briefings
              mountPath: /briefings
          resources:
            requests:
              cpu: 20m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
        - name: workflows
          configMap:
            name: n8n-workflows
        # Daily briefings land in the shared folder, so the document search indexes them too
        - name: briefings
          hostPath:
            path: /mnt/e/ai-files/briefings
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: automation
spec:
  selector:
    app: n8n
  ports:
    - name: http
      port: 5678
      targetPort: http
