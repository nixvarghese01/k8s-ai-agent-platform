# Phoenix: LLM tracing at https://phoenix.ai.local (README §6.16), profile observability.
# Every agent run (retrieve -> model -> tools) and every LiteLLM call is sent here over
# OpenTelemetry (OTLP HTTP :6006/v1/traces). Chosen over Langfuse v3 for the laptop budget:
# one container + SQLite (~0.3 GB) instead of web + worker + ClickHouse + Redis (~1.5-2 GB).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phoenix-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: observability
  labels:
    app: phoenix
    local-ai/profile: observability # off unless the observability profile is on (scripts/profiles.sh)
spec:
  # no replicas: profiles.sh scales it (0/1); apply and ArgoCD leave that alone
  strategy:
    type: Recreate # SQLite on a ReadWriteOnce volume
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # the image's nonroot user
        fsGroup: 65532
      containers:
        - name: phoenix
          # Pinned like LiteLLM: change tag + digest deliberately, apply, check phoenix.ai.local
          image: arizephoenix/phoenix:version-20.19.0@sha256:d240d8d4e364ee3483ed2de41ec12b760cc90bb0d4c6e2f190388772aba6fe1f
          env:
            - name: PHOENIX_WORKING_DIR
              value: /data # SQLite database and exports
            - name: PHOENIX_PORT
              value: "6006"
            - name: PHOENIX_GRPC_PORT
              value: "4317"
            - name: PHOENIX_TELEMETRY_ENABLED
              value: "false"
            - name: PHOENIX_ROOT_URL
              value: https://phoenix.ai.local
          ports:
            - name: http # UI + OTLP over HTTP (/v1/traces)
              containerPort: 6006
            - name: otlp-grpc
              containerPort: 4317
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: phoenix-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: observability
spec:
  selector:
    app: phoenix
  ports:
    - name: http
      port: 6006
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
