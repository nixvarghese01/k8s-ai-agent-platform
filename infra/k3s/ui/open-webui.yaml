# Open WebUI chat, backed by host Ollama (LLM + embeddings) and Qdrant (RAG vectors).
# UI: http://chat.local (see ingress/ingresses.yaml). The first account created becomes admin.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ui
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ui
  labels:
    app: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.4
          ports:
            - name: http
              containerPort: 8080
          env:
            # Ollama runs on the WSL host; llm/ollama-host.yaml gives it this in-cluster name
            - name: OLLAMA_BASE_URL
              value: http://ollama.llm.svc.cluster.local:11434
            - name: ENABLE_OPENAI_API
              value: "false"
            - name: VECTOR_DB
              value: qdrant
            - name: QDRANT_URI
              value: http://qdrant.storage.svc.cluster.local:6333
            # Embed with Ollama instead of downloading a sentence-transformers model
            - name: RAG_EMBEDDING_ENGINE
              value: ollama
            - name: RAG_EMBEDDING_MODEL
              value: nomic-embed-text
            - name: ANONYMIZED_TELEMETRY
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60 # first start runs DB migrations; allow up to 10 min
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ui
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: http
