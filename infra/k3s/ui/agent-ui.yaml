# Agent UI (Streamlit) at https://agent.ai.local: chat with the file agent (agent/agent.yaml) and
# see its tool calls. Image built locally by infra/scripts/build-images.sh (`make images`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ui
  namespace: ui
  labels:
    app: agent-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-ui
  template:
    metadata:
      labels:
        app: agent-ui
    spec:
      containers:
        - name: agent-ui
          image: ghcr.io/nixvarghese01/local-ai-agent-ui:sha-37350f4a8203c61c9746c0212c5b121aa5d2610c@sha256:5b0028b6bd6a5d77c2b8a83ac3978cb3774ba2e9a61bbb175849276fa2616fef
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: AGENT_URL
              value: http://agent.agent.svc.cluster.local:8000
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agent-ui
  namespace: ui
spec:
  selector:
    app: agent-ui
  ports:
    - name: http
      port: 8501
      targetPort: http
