# Host-based routing through k3s's bundled Traefik, HTTPS only (README §6.14). Each name needs a
# Windows hosts-file entry (§6.7). An Ingress must live in its Service's namespace.
# Every UI is behind single sign-on: the router.middlewares annotation sends each request to
# Authelia first (auth/authelia.yaml); only auth.ai.local itself, the sign-in page, is open.
# TLS: router.tls uses Traefik's default certificate, *.ai.local (ingress/tls.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth
  namespace: auth
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: auth.ai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authelia
                port:
                  name: http
---
